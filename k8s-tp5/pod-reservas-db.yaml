apiVersion: v1 
kind: Pod 
metadata: 
  name: reservas-db 
  labels: 
    app: reservas-db 
spec: 
  containers: 
    - name: mysql 
      image: mysql:8.4 
      ports: 
        - containerPort: 3306 
      env: 
        - name: MYSQL_ROOT_PASSWORD 
          value: "reservas_root_pass" 
        - name: MYSQL_DATABASE 
          value: "reservasdb" 
        - name: MYSQL_USER 
          value: "reservas_user" 
        - name: MYSQL_PASSWORD 
          value: "reservas_pass"
