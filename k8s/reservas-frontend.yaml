apiVersion: v1 
kind: Service 
metadata: 
  name: reservas-frontend 
spec: 
  type: NodePort 
  ports: 
    - port: 80 
      targetPort: 8080 
      nodePort: 30301 
  selector: 
    app: reservas-frontend 
--- 
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: reservas-frontend 
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      app: reservas-frontend 
  template: 
    metadata: 
      labels: 
        app: reservas-frontend 
    spec: 
      containers: 
        - name: frontend 
          image: ccinquemani87/reservas-frontend:v1 
          ports: 
            - containerPort: 8080
