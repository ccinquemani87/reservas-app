apiVersion: v1 
kind: Pod 
metadata: 
  name: reservas-api 
  labels: 
    app: reservas-api 
spec: 
  containers: 
    - name: api 
      image: ccinquemani87/reservas-api:v1 
      ports: 
        - containerPort: 3000 
      env: 
        - name: PORT 
          value: "3000" 
        - name: DB_HOST 
          value: "reservas-db" 
        - name: DB_PORT 
          value: "3306" 
        - name: DB_USER 
          value: "reservas_user" 
        - name: DB_PASSWORD 
          value: "reservas_pass" 
        - name: DB_NAME 
          value: "reservasdb"
