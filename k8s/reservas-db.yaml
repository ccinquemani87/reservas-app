apiVersion: v1 
kind: Service 
metadata: 
  name: reservas-db 
spec: 
  type: ClusterIP 
  ports: 
    - port: 3306 
      targetPort: 3306 
  selector: 
    app: reservas-db 
--- 
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: reservas-db 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      app: reservas-db 
  template: 
    metadata: 
      labels: 
        app: reservas-db 
    spec: 
      containers: 
        - name: mysql 
          image: mysql:8.4 
          ports: 
            - containerPort: 3306 
          env: 
            - name: MYSQL_ROOT_PASSWORD 
              value: "root" 
            - name: MYSQL_DATABASE 
              value: "db_reservas" 
            - name: MYSQL_USER 
              value: "user_reservas" 
            - name: MYSQL_PASSWORD 
              value: "pass_reservas"
