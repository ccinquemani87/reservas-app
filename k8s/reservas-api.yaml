apiVersion: v1 
kind: Service 
metadata: 
  name: reservas-api 
spec: 
  type: ClusterIP 
  ports: 
    - port: 3000 
      targetPort: 3000 
  selector: 
    app: reservas-api 
--- 
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: reservas-api
  namespace: reservas-app
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      app: reservas-api 
  template: 
    metadata: 
      labels: 
        app: reservas-api 
    spec: 
      containers: 
      - name: api 
        image: ccinquemani87/reservas-api:v
        ports: 
        - containerPort: 3000 
        env: 
        - name: DB_USER 
          valueFrom: 
            secretKeyRef: 
              name: reservas-db-secret 
              key: MYSQL_USER 
        - name: DB_PASSWORD 
          valueFrom: 
            secretKeyRef: 
              name: reservas-db-secret 
              key: MYSQL_PASSWORD 
        envFrom: 
        - configMapRef: 
            name: reservas-api-config 
        resources: 
          requests: 
            cpu: "100m" 
            memory: "64Mi" 
          limits: 
            cpu: "250m" 
            memory: "128Mi"
