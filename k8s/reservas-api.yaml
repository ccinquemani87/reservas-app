apiVersion: v1 
kind: Service 
metadata: 
  name: reservas-api 
spec: 
  type: ClusterIP 
  ports: 
    - port: 3000 
      targetPort: 3000 
  selector: 
    app: reservas-api 
--- 
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: reservas-api 
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      app: reservas-api 
  template: 
    metadata: 
      labels: 
        app: reservas-api 
    spec: 
      containers: 
        - name: api 
          image: ccinquemani87/reservas-api:v1 
          ports: 
            - containerPort: 3000 
          env: 
            - name: DB_HOST 
              value: "reservas-db" 
            - name: DB_USER 
              value: "user_reservas" 
            - name: DB_PASSWORD 
              value: "pass_reservas" 
            - name: DB_NAME 
              value: "db_reservas" 
            - name: DB_PORT 
              value: "3306" 
            - name: PORT 
              value: "3000"
